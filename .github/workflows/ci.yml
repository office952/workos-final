name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_full:
        description: Force conservative full CI
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Classify CI impact
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL_INPUT: ${{ github.event.inputs.force_full }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${FORCE_FULL_INPUT}" != "false" ]; then
            node scripts/classify-ci-impact.mjs --force-full --github-output >> "$GITHUB_OUTPUT"
            echo "CI_TIER=TIER_4_CONSERVATIVE_FULL (workflow_dispatch)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${BASE_REF}"
            git diff --name-only --no-renames "origin/${BASE_REF}...HEAD" > "${RUNNER_TEMP}/changed.txt"
          elif [ "${EVENT_NAME}" = "push" ]; then
            if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              node scripts/classify-ci-impact.mjs --force-full --github-output >> "$GITHUB_OUTPUT"
              echo "CI_TIER=TIER_4_CONSERVATIVE_FULL (new ref)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git diff --name-only --no-renames "${BEFORE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed.txt"
          else
            node scripts/classify-ci-impact.mjs --force-full --github-output >> "$GITHUB_OUTPUT"
            echo "CI_TIER=TIER_4_CONSERVATIVE_FULL (unknown event)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -E '^(\.github/workflows/|scripts/classify-ci-impact|scripts/run-local-ci-tier\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|playwright.+\.config\.|\.cursor/run-isolated-e2e\.mjs$|\.cursor/hooks/)' "${RUNNER_TEMP}/changed.txt" >/dev/null; then
            node scripts/classify-ci-impact.mjs --force-full --github-output >> "$GITHUB_OUTPUT"
            echo "CI_TIER=TIER_4_CONSERVATIVE_FULL (YAML force-full on CI/toolchain paths)" >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/classify-ci-impact.mjs --github-output --paths-file "${RUNNER_TEMP}/changed.txt" >> "$GITHUB_OUTPUT"
            echo "CI_TIER=$(grep '^tier=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Changed paths:" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' "${RUNNER_TEMP}/changed.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Require classification outputs
        run: |
          set -euo pipefail
          test -n "${{ steps.classify.outputs.tier }}"
          test -n "${{ steps.classify.outputs.run_docs_check }}"
          test -n "${{ steps.classify.outputs.run_lint }}"
          test -n "${{ steps.classify.outputs.run_typecheck }}"
          test -n "${{ steps.classify.outputs.run_test }}"
          test -n "${{ steps.classify.outputs.run_build }}"
          test -n "${{ steps.classify.outputs.run_e2e }}"
          test -n "${{ steps.classify.outputs.install_chromium }}"
      - run: pnpm docs:check
        if: steps.classify.outputs.run_docs_check == 'true'
      - run: pnpm lint
        if: steps.classify.outputs.run_lint == 'true'
      - run: pnpm typecheck
        if: steps.classify.outputs.run_typecheck == 'true'
      - run: pnpm test
        if: steps.classify.outputs.run_test == 'true'
      - run: pnpm build
        if: steps.classify.outputs.run_build == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.classify.outputs.install_chromium == 'true'
      - run: pnpm e2e
        if: steps.classify.outputs.run_e2e == 'true'
